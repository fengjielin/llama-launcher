; =====================================================================
; llama-server 模型配置中心（--models-preset 加载的文件）
;
; 用法：
;   · 段名 = llama-server 识别出的模型名（GGUF 文件名去掉 .gguf），
;     启动日志 "Available models" 列出的就是可用名字，照抄。
;   · [*] 通配段不被支持（会得到 "Loaded 0 custom model presets"）。
;   · 本文件里定义过的键，启动脚本不再通过命令行传 —— preset 优先，
;     避免命令行把这里的值盖掉（实测 CLI 优先级高于 preset）。
;   · 文件必须是 UTF-8 且【不带 BOM】，否则 llama-server 直接解析失败
;     （"failed to parse server config file"）。
;   · 启动后看日志里模型名旁的 *，有 * 才表示该模型吃到了自定义 preset。
;
; 实测支持的键（本机 b10488 版本）：
;   ctx-size / cache-type-k / cache-type-v / fit-target / threads /
;   temperature / top-p / top-k / min-p / presence-penalty / n-predict /
;   flash-attn / load-mode / reasoning-budget / n-gpu-layers / aliases
;
; 没列出的模型：脚本按显存档位自动兜底（ctx / KV / fit / 采样默认）。
; =====================================================================

; ------------------------------------------------------------
; [defaults] 特殊段（脚本读取，llama-server 忽略空段）
;   默认模型写在注释里，脚本按约定解析（llama-server 不认自定义键，
;   实测 option not recognized 会直接退出，所以不能写 `default-model =`）。
;   default-model = 启动时预加载的模型 ID（GGUF 文件名去掉 .gguf）
;   留空或不写 = 不预加载，首次请求才加载。
;   优先级：环境变量 LLAMA_ONECLICK_DEFAULT_MODEL > 这里 > 脚本变量。
; ------------------------------------------------------------
[defaults]
; default-model = Qwen3.8-27B-Uncensored-IQ4_XS

; ============================================================
; 27B 大模型 —— 16G 显存下按"尽量多上卡"配置（实测 7~10 tok/s）
;   ctx 16384 收紧（原生 256K 太吃 KV）；KV 用 q4_0 减半；
;   fit-target 1024 多留 1G 给权重上卡；mlock 防换页。
;   想要更激进（约 9.8 tok/s）：ctx-size 改 8192，fit-target 改 512，
;   threads 改 12。
; ============================================================
[Qwen3.8-27B-Uncensored-IQ4_XS]
ctx-size = 16384
cache-type-k = q4_0
cache-type-v = q4_0
fit-target = 1024
load-mode = mmap+mlock
threads = 6

[Qwen3.8-27B-Uncensored-IQ2_M]
ctx-size = 16384
cache-type-k = q4_0
cache-type-v = q4_0
fit-target = 1024
load-mode = mmap+mlock
threads = 6

; ============================================================
; 7B / 8B 小模型 —— 16G 显存随便装，KV 用 q8_0 保质量，ctx 放宽
; ============================================================
[qwen2.5-7b-instruct-q4_k_m]
ctx-size = 32768
cache-type-k = q8_0
cache-type-v = q8_0
fit-target = 1024
load-mode = mmap+mlock
threads = 6

[qwen2.5-7b-instruct-q5_k_m]
ctx-size = 32768
cache-type-k = q8_0
cache-type-v = q8_0
fit-target = 1024
load-mode = mmap+mlock
threads = 6

[meta-llama.Meta-Llama-3-8B-Instruct.Q4_K_M]
ctx-size = 32768
cache-type-k = q8_0
cache-type-v = q8_0
fit-target = 1024
load-mode = mmap+mlock
threads = 6
